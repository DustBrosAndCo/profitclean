# Fly.io app configuration for ProfitClean.

app = "dustbros-profitclean"
primary_region = "iad"

[build]

[env]
  PROFITCLEAN_DATA_DIR = "/data"

[[mounts]]
  source = "profitclean_data"
  destination = "/data"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/_stcore/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
